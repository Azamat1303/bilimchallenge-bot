<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qidiruv — BilimChallenge</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .page{padding:100px 0 60px;}
  .page-header{text-align:center;margin-bottom:32px;}
  .page-header h1{font-size:clamp(26px,3.5vw,36px);font-weight:700;margin-bottom:10px;}
  .page-header p{color:var(--text-dim);font-size:14px;}

  .search-box{max-width:480px;margin:0 auto 36px;position:relative;}
  .search-box input{padding-left:44px;font-size:15px;padding-top:14px;padding-bottom:14px;}
  .search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:16px;}

  .result-list{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px;}
  .result-row{
    display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;
    background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:border-color 0.2s;
  }
  .result-row:hover{border-color:var(--cyan-dim);}
  .result-avatar{
    width:42px;height:42px;border-radius:50%;background:var(--panel-2);display:flex;align-items:center;
    justify-content:center;font-family:'Space Grotesk';font-weight:700;color:var(--cyan);flex-shrink:0;
  }
  .result-name{flex:1;font-size:14px;font-weight:600;}
  .result-username{color:var(--text-dim);font-size:12px;font-weight:400;}
  .result-coins{font-family:'Space Grotesk';font-weight:700;color:var(--gold);font-size:13px;}

  .hint{text-align:center;color:var(--text-dim);font-size:13px;margin-top:16px;}
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="brand" href="index.html">
      <svg class="brand-mark" viewBox="0 0 32 32" fill="none">
        <path d="M16 3C10 3 6 7.5 6 13c0 3.2 1.6 5.6 3.5 7.3L9 27h4l0.6-4.2c0.8 0.1 1.6 0.2 2.4 0.2s1.6-0.1 2.4-0.2L19 27h4l-0.5-6.7c1.9-1.7 3.5-4.1 3.5-7.3 0-5.5-4-10-10-10z" stroke="#3ED9C8" stroke-width="1.6"/>
        <circle cx="16" cy="13" r="3.2" fill="#F5B942"/>
      </svg>
      BilimChallenge
    </a>
    <div class="nav-links">
      <a href="index.html">Savollar</a>
      <a href="rating.html">Reyting</a>
      <a href="shop.html">Magazin</a>
      <a href="games.html">Mini o'yinlar</a>
      <a href="search.html" class="active">Qidiruv</a>
    </div>
    <div class="nav-right" id="authSlot"></div>
  </div>
</nav>

<div class="page wrap">
  <div class="page-header">
    <h1>🔍 Foydalanuvchi qidirish</h1>
    <p>Ism yoki username orqali boshqa o'yinchilarni toping</p>
  </div>

  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="search" id="searchInput" placeholder="Ism yoki @username yozing..." autocomplete="off">
  </div>

  <div class="result-list" id="resultList"></div>
  <div class="hint" id="hint">Qidirish uchun kamida 2 ta harf kiriting</div>
</div>

<footer>
  <div class="wrap">
    <div class="brand" style="font-size:14px;">
      <svg class="brand-mark" style="width:20px;height:20px;" viewBox="0 0 32 32" fill="none">
        <path d="M16 3C10 3 6 7.5 6 13c0 3.2 1.6 5.6 3.5 7.3L9 27h4l0.6-4.2c0.8 0.1 1.6 0.2 2.4 0.2s1.6-0.1 2.4-0.2L19 27h4l-0.5-6.7c1.9-1.7 3.5-4.1 3.5-7.3 0-5.5-4-10-10-10z" stroke="#3ED9C8" stroke-width="1.6"/>
        <circle cx="16" cy="13" r="3.2" fill="#F5B942"/>
      </svg>
      BilimChallenge
    </div>
    <div class="foot-links">
      <a href="https://t.me/BilimChallenge_bot" target="_blank" rel="noopener">Telegram bot</a>
    </div>
  </div>
</footer>

<script src="assets/config.js"></script>
<script src="assets/api.js"></script>
<script>
let debounceTimer = null;

document.getElementById("searchInput").addEventListener("input", (e) => {
  clearTimeout(debounceTimer);
  const q = e.target.value.trim();
  const hint = document.getElementById("hint");
  const list = document.getElementById("resultList");

  if (q.length < 2) {
    list.innerHTML = "";
    hint.style.display = "block";
    hint.textContent = "Qidirish uchun kamida 2 ta harf kiriting";
    return;
  }
  hint.style.display = "none";

  debounceTimer = setTimeout(() => doSearch(q), 350);
});

async function doSearch(q) {
  const list = document.getElementById("resultList");
  const hint = document.getElementById("hint");
  list.innerHTML = `<div style="text-align:center;padding:20px;"><div class="spinner" style="margin:0 auto;"></div></div>`;

  try {
    const results = await BC.api(`/api/search?q=${encodeURIComponent(q)}`);
    if (!results.length) {
      list.innerHTML = "";
      hint.style.display = "block";
      hint.textContent = "Hech kim topilmadi";
      return;
    }
    list.innerHTML = "";
    results.forEach((user) => {
      const initial = user.first_name && user.first_name[0] ? user.first_name[0].toUpperCase() : "?";
      const row = document.createElement("div");
      row.className = "result-row";
      row.addEventListener("click", () => (location.href = `profile.html?id=${user.user_id}`));
      row.innerHTML = `
        <div class="result-avatar">${initial}</div>
        <div class="result-name">${BC.escapeHtml(user.first_name || "?")} ${user.username ? `<span class="result-username">@${BC.escapeHtml(user.username)}</span>` : ""}</div>
        <div class="result-coins">${BC.formatCoins(user.coins)} 💰</div>
      `;
      list.appendChild(row);
    });
  } catch (e) {
    list.innerHTML = `<div class="empty-state"><p>Xato: ${BC.escapeHtml(e.message)}</p></div>`;
  }
}
</script>

</body>
</html>
