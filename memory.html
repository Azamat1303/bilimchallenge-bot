<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Juftlik Topish — BilimChallenge</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<style>
  body{padding:20px 16px 40px;display:flex;flex-direction:column;align-items:center;}
  header{width:100%;max-width:480px;display:flex;align-items:center;justify-content:space-between;margin:20px 0 18px;}
  .back{font-size:14px;color:var(--text-dim);display:flex;align-items:center;gap:6px;}
  .back:hover{color:var(--cyan);}
  h1{font-size:20px;font-weight:700;}

  .diff-row{display:flex;gap:8px;width:100%;max-width:480px;margin-bottom:18px;}
  .diff-btn{
    flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
    color:var(--text-dim);font-size:13px;font-weight:600;cursor:pointer;transition:all 0.2s;
  }
  .diff-btn.active{border-color:var(--cyan);color:var(--cyan);background:rgba(62,217,200,0.08);}

  .hud{width:100%;max-width:480px;display:flex;gap:10px;margin-bottom:20px;}
  .hud-chip{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:center;}
  .hud-chip b{font-family:'Space Grotesk';font-size:22px;display:block;}
  .hud-chip span{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.04em;}
  .hud-chip.time b{color:var(--gold);}
  .hud-chip.moves b{color:var(--cyan);}
  .hud-chip.best b{color:#B98CFF;}

  .board{width:100%;max-width:480px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .tile{aspect-ratio:1;border-radius:14px;position:relative;cursor:pointer;perspective:600px;}
  .tile-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 0.45s cubic-bezier(.2,.8,.3,1.2);}
  .tile.flipped .tile-inner, .tile.matched .tile-inner{transform:rotateY(180deg);}
  .tile-face{position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;}
  .tile-back{background:linear-gradient(145deg,var(--panel-2),var(--panel));border:1px solid var(--line);}
  .tile-back::after{content:'?';font-family:'Space Grotesk';font-size:22px;color:var(--text-dim);opacity:0.5;}
  .tile-front{background:var(--panel-2);border:1px solid var(--cyan-dim);transform:rotateY(180deg);font-size:32px;}
  .tile.matched .tile-front{background:rgba(62,217,200,0.12);border-color:var(--cyan);box-shadow:0 0 0 3px rgba(62,217,200,0.15);}
  @keyframes shake{0%,100%{transform:rotateY(180deg) translateX(0);}25%{transform:rotateY(180deg) translateX(-6px);}75%{transform:rotateY(180deg) translateX(6px);}}
  .tile.shake .tile-inner{animation:shake 0.35s;}

  .win-panel{display:none;width:100%;max-width:480px;margin-top:24px;background:var(--panel);border:1px solid var(--cyan-dim);border-radius:16px;padding:28px;text-align:center;}
  .win-panel.show{display:block;animation:fadeUp 0.4s ease;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  .win-panel .emoji{font-size:40px;margin-bottom:12px;}
  .win-panel h2{font-size:22px;margin-bottom:6px;}
  .win-panel p{color:var(--text-dim);font-size:14px;margin-bottom:20px;}
  .win-stats{display:flex;justify-content:center;gap:28px;margin-bottom:22px;flex-wrap:wrap;}
  .win-stats div b{font-family:'Space Grotesk';font-size:24px;display:block;color:var(--gold);}
  .win-stats div span{font-size:12px;color:var(--text-dim);}
  .btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

  .login-note{
    width:100%;max-width:480px;background:rgba(245,185,66,0.08);border:1px solid rgba(245,185,66,0.3);
    border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:13px;color:var(--gold);text-align:center;
  }
</style>
</head>
<body>

<header>
  <a class="back" href="../games.html">← O'yinlarga qaytish</a>
  <h1 class="display">🧩 Juftlik Topish</h1>
  <div style="width:80px;"></div>
</header>

<div class="login-note" id="loginNote" style="display:none;">
  🔐 Coin olish uchun <a href="../index.html" style="color:var(--gold);text-decoration:underline;">tizimga kiring</a>. Hozircha faqat sinov rejimida o'ynayapsiz.
</div>

<div class="diff-row" id="diffRow">
  <button class="diff-btn active" data-pairs="6">Oson · 6 juft</button>
  <button class="diff-btn" data-pairs="8">O'rta · 8 juft</button>
  <button class="diff-btn" data-pairs="10">Qiyin · 10 juft</button>
</div>

<div class="hud">
  <div class="hud-chip time"><b id="timeVal">0:00</b><span>Vaqt</span></div>
  <div class="hud-chip moves"><b id="movesVal">0</b><span>Urinishlar</span></div>
  <div class="hud-chip best"><b id="bestVal">—</b><span>Rekord</span></div>
</div>

<div class="board" id="board"></div>

<div class="win-panel" id="winPanel">
  <div class="emoji">🏆</div>
  <h2 class="display">Barcha juftliklar topildi!</h2>
  <p id="winSubtext">Ajoyib xotira ko'rsatdingiz.</p>
  <div class="win-stats">
    <div><b id="winTime">0:00</b><span>Vaqt</span></div>
    <div><b id="winMoves">0</b><span>Urinishlar</span></div>
    <div id="winCoinsWrap" style="display:none;"><b id="winCoins">0</b><span>Coin</span></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" id="playAgainBtn">Qayta o'ynash</button>
    <a class="btn btn-ghost" href="../games.html">Boshqa o'yin</a>
  </div>
</div>

<script src="../assets/config.js"></script>
<script src="../assets/api.js"></script>
<script>
const ICONS = ['🧠','💡','🎯','⚡','🔬','📚','🚀','🧩','🎨','🔑','⭐','🌍','🎲','🧬','🛰️','📐'];

let pairsCount = 6;
let cards = [];
let flipped = [];
let matchedCount = 0;
let moves = 0;
let timer = null;
let seconds = 0;
let locked = false;
let started = false;
let gameSession = null; // {started_at, signature}

document.getElementById("loginNote").style.display = BC.isLoggedIn() ? "none" : "block";

function storageKey(){ return 'bc_memory_best_' + pairsCount; }
function loadBest(){
  const v = localStorage.getItem(storageKey());
  document.getElementById("bestVal").textContent = v ? v + 's' : '—';
}
function formatTime(s){
  const m = Math.floor(s/60), r = s%60;
  return m + ':' + String(r).padStart(2,'0');
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

async function buildBoard(){
  clearInterval(timer);
  seconds = 0; moves = 0; matchedCount = 0; flipped = []; locked = false; started = false;
  document.getElementById("timeVal").textContent = '0:00';
  document.getElementById("movesVal").textContent = '0';
  document.getElementById("winPanel").classList.remove('show');
  loadBest();

  if (BC.isLoggedIn()) {
    try {
      gameSession = await BC.api("/api/games/start", { method: "POST", body: { game: "memory" } });
    } catch (e) {
      gameSession = null;
    }
  }

  const chosenIcons = shuffle(ICONS.slice()).slice(0, pairsCount);
  cards = shuffle([...chosenIcons, ...chosenIcons]).map((icon, idx) => ({icon, idx, matched:false}));

  const board = document.getElementById("board");
  board.style.gridTemplateColumns = pairsCount <= 8 ? 'repeat(4,1fr)' : 'repeat(5,1fr)';
  board.innerHTML = '';
  cards.forEach((card, i) => {
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.dataset.idx = i;
    tile.innerHTML = `
      <div class="tile-inner">
        <div class="tile-face tile-back"></div>
        <div class="tile-face tile-front">${card.icon}</div>
      </div>`;
    tile.addEventListener('click', () => handleFlip(i, tile));
    board.appendChild(tile);
  });
}

function startTimer(){
  if(started) return;
  started = true;
  timer = setInterval(() => {
    seconds++;
    document.getElementById("timeVal").textContent = formatTime(seconds);
  }, 1000);
}

function handleFlip(i, tile){
  if(locked) return;
  if(tile.classList.contains('flipped') || tile.classList.contains('matched')) return;
  if(flipped.length === 2) return;

  startTimer();
  tile.classList.add('flipped');
  flipped.push({i, tile});

  if(flipped.length === 2){
    moves++;
    document.getElementById("movesVal").textContent = moves;
    locked = true;
    const [a, b] = flipped;
    if(cards[a.i].icon === cards[b.i].icon){
      setTimeout(() => {
        a.tile.classList.add('matched');
        b.tile.classList.add('matched');
        cards[a.i].matched = true;
        cards[b.i].matched = true;
        matchedCount++;
        flipped = [];
        locked = false;
        if(matchedCount === pairsCount){
          clearInterval(timer);
          setTimeout(showWin, 400);
        }
      }, 380);
    } else {
      a.tile.classList.add('shake');
      b.tile.classList.add('shake');
      setTimeout(() => {
        a.tile.classList.remove('flipped','shake');
        b.tile.classList.remove('flipped','shake');
        flipped = [];
        locked = false;
      }, 700);
    }
  }
}

async function showWin(){
  document.getElementById('winTime').textContent = formatTime(seconds);
  document.getElementById('winMoves').textContent = moves;
  document.getElementById('winPanel').classList.add('show');

  const key = storageKey();
  const prevBest = localStorage.getItem(key);
  if(!prevBest || seconds < parseInt(prevBest)){
    localStorage.setItem(key, seconds);
  }
  loadBest();

  // Sifat koeffitsienti: kam urinish va tez vaqt = yuqori ball
  const idealMoves = pairsCount * 1.5;
  const moveScore = Math.max(0, Math.min(1, idealMoves / moves));
  const timeScore = Math.max(0, Math.min(1, (pairsCount * 8) / seconds));
  const scoreRatio = (moveScore + timeScore) / 2;

  if (gameSession && BC.isLoggedIn()) {
    try {
      const result = await BC.api("/api/games/finish", {
        method: "POST",
        body: {
          game: "memory",
          started_at: gameSession.started_at,
          signature: gameSession.signature,
          score_ratio: scoreRatio,
        },
      });
      if (result.earned > 0) {
        document.getElementById("winCoinsWrap").style.display = "block";
        document.getElementById("winCoins").textContent = "+" + result.earned;
        document.getElementById("winSubtext").textContent = `Siz ${result.earned} coin ishladingiz!`;
      } else if (result.message) {
        document.getElementById("winSubtext").textContent = result.message;
      }
    } catch (e) {
      /* coin berish muvaffaqiyatsiz bo'lsa ham o'yin natijasi ko'rinadi */
    }
  }
}

document.getElementById('playAgainBtn').addEventListener('click', buildBoard);

document.getElementById('diffRow').addEventListener('click', (e) => {
  const btn = e.target.closest('.diff-btn');
  if(!btn) return;
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  pairsCount = parseInt(btn.dataset.pairs);
  buildBoard();
});

buildBoard();
</script>

</body>
</html>
